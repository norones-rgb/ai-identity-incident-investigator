[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-identity-incident-investigator"
version = "0.1.0"
description = "Read-only, evidence-backed IAM incident correlation with optional local AI narratives"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Portfolio Maintainer"}]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Topic :: Security"]

[project.optional-dependencies]
ui = ["streamlit>=1.38,<2"]

[project.scripts]
identity-investigator = "identity_investigator.cli:main"

[tool.setuptools.packages.find]
include = ["identity_investigator*"]
